services:
  postgres:
    image: postgres:16
    container_name: bms_postgres
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms123
      POSTGRES_DB: bookmyshow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bms_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: